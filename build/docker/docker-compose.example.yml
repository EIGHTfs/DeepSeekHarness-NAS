# docker-compose.example.yml —— 容器版部署示例（改三处即可用：镜像名、PUID/PGID、宿主目录）
#
# 挂载模型（三件事同时成立）：
#   ① 数据目录 /data 用 **bind 挂载**（不是命名卷）：File Station 可见、Hyper Backup 能直接备、出事能翻日志；
#   ② 工作区**同路径挂载**（/a/b 挂到 /a/b）：会话记录里的绝对路径与裸机/NAS 版一致，方便互相迁移；
#   ③ entrypoint 按挂载清单再建 /workspace/<名> 短入口，目录选择器从 /workspace 起步。
#
# 两条硬性前提：
#   · 数据目录必须是**本地盘**。放到 CIFS/SMB 共享上会因为 noexec 与 chmod EPERM 让 pnpm 装插件失败；
#   · PUID/PGID 要与宿主目录属主一致（DSM 上一般 1026:100，可在「控制面板 → 用户」或 ls -n 查到）。
services:
  dsh:
    # 用自己构建的本地镜像时改成 dsh:local，并把下面 build 段注释掉
    image: ghcr.io/eightfs/deepseekharness-nas:latest
    # build:
    #   context: .
    #   dockerfile: build/docker/Dockerfile
    #   args:
    #     TARGET_DIR: build/master-build/dsh/target
    container_name: dsh
    restart: unless-stopped
    environment:
      PKG_VERSION: current          # 数据目录恒为 /data/current/.dsh，换镜像仍可见
      PUID: "1026"
      PGID: "100"
      UMASK: "0002"                 # 组共享：同组用户能改
      DSH_WORKSPACES_MANIFEST: /etc/dsh/workspaces.json
      # 容器启动时会把「首次认证链接」打到 docker logs；这里填**你实际访问的地址**（宿主IP:映射端口）
      DSH_ADVERTISE_URL: "http://<宿主IP>:3080"
      # 想用官方远程登录（一次性链接/设备配对）时再放开下面两行
      # DSH_PUBLIC_URL: "https://dsh.example.com"
      # DSH_TRUSTED_HOSTS: "dsh.example.com"
    volumes:
      - /volume1/docker/dsh/data:/data                 # ① 数据（本地盘！）
      - /volume1/projects:/volume1/projects            # ② 工作区：同路径挂载
      - /volume1/Downloads:/volume1/Downloads
      - ./workspaces.example.json:/etc/dsh/workspaces.json:ro   # ③ 别名清单
    ports:
      - "3080:30800"                # 只暴露反代端口；30801 留在容器内
    healthcheck:
      test: ["CMD", "/opt/dsh/start.sh", "status"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
