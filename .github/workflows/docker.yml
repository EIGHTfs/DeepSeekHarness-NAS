# docker.yml —— 构建多架构容器镜像并推 GHCR（与套件发布解耦，互不影响）
#
# 为什么单独一个 workflow、而不是塞进 build.yml：
#   镜像要在同一台 runner 上再跑一次「预编译 + 裁剪」（约 20 分钟），塞进套件流水线会拖慢它；
#   且镜像与套件是两条独立交付物，失败不该互相阻塞。
#
# 架构策略：**每个架构用原生 runner 各自构建**，再合并 manifest。
#   ① 不用 buildx 一次出多平台：我们的构建是 pnpm 装原生模块（17 个 .node），QEMU 模拟下必失败或极慢；
#   ② 两个架构写成两个显式 job 而不是 matrix：GitHub 的 **job 级 if 不支持 matrix 上下文**
#     （实测直接 422 Unrecognized named-value: 'matrix'），而「手动只构一个架构」必须能在 job 级跳过。
#     重复步骤已抽进 .github/actions/build-docker-image，加架构只需再加一个 job。
#
# 版本与 tag：从 build-meta.env 的 PKG_VER（与套件 INFO 同一来源）派生，例如 0.2.3-1002。
#   预发布（SPK_BETA=yes）只打 PKG_VER 与 alpha/beta 通道，绝不覆盖 latest。
name: Build Docker images

on:
  workflow_dispatch:
    inputs:
      dsh_tag:
        description: 官方 tag（留空取最新）
        required: false
        default: ""
      arch:
        description: 构建架构
        required: false
        type: choice
        default: both
        options: [both, x86_64, arm64]
  push:
    tags:
      - "dsh-v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: eightfs/deepseekharness-nas

jobs:
  prepare:
    name: 解析目标 tag
    runs-on: ubuntu-24.04
    outputs:
      dsh_tag: ${{ steps.tag.outputs.value }}
    steps:
      - id: tag
        shell: bash
        run: |
          set -euo pipefail
          # tag 触发用 ref 名（dsh-v*）；手动触发用输入；都空则交给 fetch 脚本取官方最新
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.dsh_tag }}" >> "$GITHUB_OUTPUT"
          fi

  build-x86_64:
    name: image-x86_64
    needs: prepare
    if: ${{ github.event_name == 'push' || inputs.arch == 'both' || inputs.arch == 'x86_64' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 唯一构建（预编译 + 裁剪）
        uses: ./.github/actions/build-target
        with:
          token: ${{ github.token }}
          dsh_tag: ${{ needs.prepare.outputs.dsh_tag }}
          arch: x86_64
          artifact-name: build-target-x86_64
      - name: 构建镜像
        uses: ./.github/actions/build-docker-image
        with:
          arch: x86_64
          platform: linux/amd64
          suffix: amd64
          image: ${{ env.IMAGE }}
          registry: ${{ env.REGISTRY }}
          token: ${{ github.token }}

  build-arm64:
    name: image-arm64
    needs: prepare
    if: ${{ github.event_name == 'push' || inputs.arch == 'both' || inputs.arch == 'arm64' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 唯一构建（预编译 + 裁剪）
        uses: ./.github/actions/build-target
        with:
          token: ${{ github.token }}
          dsh_tag: ${{ needs.prepare.outputs.dsh_tag }}
          arch: arm64
          artifact-name: build-target-arm64
      - name: 构建镜像
        uses: ./.github/actions/build-docker-image
        with:
          arch: arm64
          platform: linux/arm64
          suffix: arm64
          image: ${{ env.IMAGE }}
          registry: ${{ env.REGISTRY }}
          token: ${{ github.token }}

  manifest:
    name: manifest
    needs: [build-x86_64, build-arm64]
    # 只有两个架构都成功才有可合并的东西；单架构手动构建时天然跳过（架构 tag 已可直接用）
    if: ${{ needs.build-x86_64.result == 'success' && needs.build-arm64.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # 与 SPK/FPK 打包 job 同一套契约：下载 artifact 并解包回 build/master-build/build/
      - name: 下载并解包 target/meta
        uses: ./.github/actions/pack-with-target
        with:
          artifact-name: build-target-x86_64

      - name: 计算 tag 列表
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          meta="build/master-build/build/build-meta.env"
          pkg_ver="$(awk -F= '/^PKG_VER=/{gsub(/"/,"",$2); print $2}' "$meta" | tail -1)"
          beta="$(awk -F= '/^SPK_BETA=/{gsub(/"/,"",$2); print $2}' "$meta" | tail -1)"
          test -n "$pkg_ver" || { echo "✗ 没读到 PKG_VER" >&2; exit 1; }
          base="${REGISTRY}/${IMAGE}"
          tags="${base}:${pkg_ver}"
          if [ "${beta:-no}" = "yes" ]; then
            # 预发布：只打通道名，绝不覆盖 latest（阶段位 1xxx=alpha / 2xxx=beta / 4xxx=preview）
            case "$pkg_ver" in
              *1[0-9][0-9][0-9]) channel=alpha ;;
              *2[0-9][0-9][0-9]) channel=beta ;;
              *4[0-9][0-9][0-9]) channel=preview ;;
              *) channel=pre-release ;;
            esac
            tags="$tags ${base}:${channel}"
          else
            tags="$tags ${base}:latest"
          fi
          echo "PKG_VER=$pkg_ver" >> "$GITHUB_OUTPUT"
          echo "LIST=$tags" >> "$GITHUB_OUTPUT"
          echo "待打 tag：$tags"

      - name: 登录镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 合并多架构 manifest
        shell: bash
        run: |
          set -euo pipefail
          base="${REGISTRY}/${IMAGE}:${{ steps.tags.outputs.PKG_VER }}"
          args=""
          for tag in ${{ steps.tags.outputs.LIST }}; do args="$args -t $tag"; done
          docker buildx imagetools create $args "${base}-amd64" "${base}-arm64"
          echo "── 合并结果"
          docker buildx imagetools inspect "${base}"
