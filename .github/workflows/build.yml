# build.yml —— 公共 target + 平台产物（注册表驱动、按变化动态调度）
#
# 设计要点（为什么要这么排）：
#   ① **平台清单来自 build/config/platforms.json**：新增产物平台（spk/fpk/docker 之外的）
#      只需在注册表里加一条 + 写一个可执行打包命令，本文件不用改 —— matrix 由
#      discover 输出的 JSON 展开。
#   ② **动态执行**：每个平台声明 watch 路径，discover 用 git diff 判定「所属部分有没有变化」；
#      没变化的平台在 pack 里整段跳过（step 级 if 引用 matrix —— job 级 if 不支持 matrix，
#      这一点实测踩过 422）。
#   ③ **只改启动脚本不重建公共包**：start.sh 模板/打包器都不在 target 的缓存 key 里，
#      所以这类改动会命中 target 缓存、只重打产物（日志会明确写「复用缓存」）。
#   ④ **dry_run**：只跑 discover 并把计划写进 Summary，不执行任何构建 —— 用来验证判定逻辑，
#      一分钟内跑完。
#
# 触发：
#   · push tag v*        → 全量（发版语义）
#   · workflow_dispatch  → 按 diff 判定；可 force_all 强制全量、可 dry_run 只看计划
#   · workflow_call      → 供 rebuild-many.yml 批量调用
name: Build (target + platforms)

on:
  workflow_dispatch:
    inputs:
      dsh_tag:
        description: '指定官方 tag（如 dsh-v<版本>）；留空 = 官方最新'
        required: false
        default: ''
      arch:
        description: '目标架构'
        required: false
        type: choice
        options: ['x86_64', 'arm64']
        default: 'x86_64'
      targets:
        description: '只构建这些平台（逗号分隔；留空 = 全部；如 spk,fpk）'
        required: false
        default: ''
      force_all:
        description: '强制全部构建（忽略变化检测）'
        required: false
        type: boolean
        default: false
      base_sha:
        description: '变化检测基准 sha（留空=自动取上次成功构建的 sha）'
        required: false
        default: '' 
      dry_run:
        description: '只输出构建计划，不执行任何构建'
        required: false
        type: boolean
        default: false
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      dsh_tag:
        description: '官方 tag（如 dsh-v<版本>）；留空 = 官方最新'
        required: false
        type: string
        default: ''
      arch:
        description: '目标架构：x86_64 或 arm64'
        required: false
        type: string
        default: 'x86_64'
      targets:
        description: '只构建这些平台（逗号分隔；留空 = 全部）'
        required: false
        type: string
        default: ''
      force_all:
        description: '强制全部构建'
        required: false
        type: boolean
        default: false
      base_sha:
        description: '变化检测基准 sha（留空=自动）'
        required: false
        type: string
        default: '' 
      dry_run:
        description: '只输出计划'
        required: false
        type: boolean
        default: false

permissions:
  contents: write     # 发 Release
  packages: write     # 推 GHCR（docker 平台）
  actions: write      # 清理/查询 workflow 记录

concurrency:
  group: ${{ github.workflow }}-${{ inputs.arch || 'x86_64' }}-${{ inputs.dsh_tag || github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: eightfs/deepseekharness-nas

jobs:
  # ── 计划：解析平台清单 + 变化检测 ───────────────────────────────────────────
  plan-platforms:
    name: 计划（平台/变化检测）
    runs-on: ubuntu-24.04
    outputs:
      platforms: ${{ steps.plan.outputs.platforms }}
      need_target: ${{ steps.plan.outputs.need_target }}
      target_changed: ${{ steps.plan.outputs.target_changed }}
      has_registry: ${{ steps.plan.outputs.has_registry }}
      arch: ${{ steps.meta.outputs.arch }}
      dsh_tag: ${{ steps.meta.outputs.dsh_tag }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0      # 变化检测要 diff，必须完整历史

      - name: 解析输入
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          echo "arch=${{ inputs.arch || 'x86_64' }}" >> "$GITHUB_OUTPUT"
          echo "dsh_tag=${{ inputs.dsh_tag }}" >> "$GITHUB_OUTPUT"
          # push tag 与 force_all 都按「全量」处理；dry_run 透传
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=${{ inputs.dry_run || 'false' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: 计算变化检测基准
        id: base
        shell: bash
        run: |
          set -euo pipefail
          base=""; head="${{ github.sha }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            # push：与推送前对比；新建 tag/branch 时 before 是全零 → 交给脚本走 no-baseline
            before="${{ github.event.before }}"
            case "$before" in
              ''|0000000000000000000000000000000000000000) base="" ;;
              *) base="$before" ;;
            esac
          else
            # 手动/被调用：与「上一次成功且 sha 不同的本 workflow」对比
            #   为什么要「sha 不同」：dry_run 的 run 也是 success，它的 headSha 就等于当前
            #   head；若直接取最近一次成功，就会退化成「与自己比 = 无变化」（实测踩到：
            #   dry_run 之后实跑判定全跳过）。这里往前找第一个不同 sha 的成功 run，
            #   它才代表「真正构建过的代码」。
            if [ -n "${{ inputs.base_sha || '' }}" ]; then
              base="${{ inputs.base_sha }}"
            else
              base="$(gh run list --workflow="${{ github.workflow }}" --status=success --limit=10 \
                        --json headSha --jq "[.[].headSha] | map(select(. != \"$head\")) | .[0] // empty" \
                        2>/dev/null || true)"
            fi
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "基准: ${base:-（无）} → $head"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成计划（ci-plan.py）
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          force_flag=""
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.force_all || 'false' }}" = "true" ]; then
            force_flag="--force-all"
          fi
          # 手动指定了 dsh_tag → 视为「要为这个官方版本出包」，强制全量：
          #   变化检测只看代码 diff，看不出「官方 tag 从 alpha.2 换到 alpha.3」这件事，
          #   而 tag 变意味着 target 与所有产物都要重做（缓存 key 也含 tag）。
          #   实测踩过：指定新 tag 触发后判定「代码无变化」→ 全部跳过 → 静默不出包。
          if [ -n "${{ inputs.dsh_tag }}" ]; then
            force_flag="--force-all"
            echo "手动指定 dsh_tag=${{ inputs.dsh_tag }} → 强制全量构建"
          fi
          python3 scripts/ci-plan.py \
            --arch "${{ steps.meta.outputs.arch }}" \
            --targets "${{ inputs.targets }}" \
            --base "${{ steps.base.outputs.base }}" \
            --head "${{ steps.base.outputs.head }}" \
            $force_flag --format text | tee /tmp/plan.txt
          json="$(python3 scripts/ci-plan.py \
            --arch "${{ steps.meta.outputs.arch }}" \
            --targets "${{ inputs.targets }}" \
            --base "${{ steps.base.outputs.base }}" \
            --head "${{ steps.base.outputs.head }}" \
            $force_flag --format json)"
          echo "platforms=$(printf '%s' "$json" | python3 -c 'import json,sys;print(json.dumps(json.load(sys.stdin)["platforms"],ensure_ascii=False))')" >> "$GITHUB_OUTPUT"
          echo "need_target=$(printf '%s' "$json" | python3 -c 'import json,sys;print(str(json.load(sys.stdin)["need_target"]).lower())')" >> "$GITHUB_OUTPUT"
          echo "target_changed=$(printf '%s' "$json" | python3 -c 'import json,sys;print(str(json.load(sys.stdin)["target_changed"]).lower())')" >> "$GITHUB_OUTPUT"
          echo "has_registry=$(printf '%s' "$json" | python3 -c 'import json,sys;print(str(any(p["changed"] and p["publish"]=="registry" for p in json.load(sys.stdin)["platforms"])).lower())')" >> "$GITHUB_OUTPUT"

      - name: 写入 Summary（计划表）
        shell: bash
        run: |
          {
            echo "## 构建计划（架构 ${{ steps.meta.outputs.arch }}）"
            echo ''
            if [ "${{ steps.meta.outputs.dry_run }}" = "true" ]; then
              echo '> **DRY-RUN**：只输出计划，未执行任何构建。'
              echo ''
            fi
            echo '```'
            cat /tmp/plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 公共 target（缓存命中则跳过编译，约 2 分钟）─────────────────────────────
  build-target:
    name: 公共 target（${{ needs.plan-platforms.outputs.arch }}）
    needs: plan-platforms
    if: needs.plan-platforms.outputs.need_target == 'true' && needs.plan-platforms.outputs.dry_run != 'true'
    runs-on: ${{ needs.plan-platforms.outputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 唯一构建（预编译 + 裁剪）
        uses: ./.github/actions/build-target
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          dsh_tag: ${{ needs.plan-platforms.outputs.dsh_tag }}
          arch: ${{ needs.plan-platforms.outputs.arch }}
          artifact-name: build-target-${{ needs.plan-platforms.outputs.arch }}

  # ── 平台产物（matrix 来自注册表；未变化的平台整段跳过）──────────────────────
  pack:
    name: ${{ matrix.name }}
    needs: [plan-platforms, build-target]
    # build-target 可能因「无需 target」而 skipped —— 只要 discover 成功就继续
    if: always() && needs.plan-platforms.result == 'success' && needs.plan-platforms.outputs.dry_run != 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan-platforms.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ needs.plan-platforms.outputs.arch }}
      PLATFORM_NAME: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v5

      - name: 下载并解包公共 target
        if: matrix.changed && matrix.needs_target
        uses: ./.github/actions/pack-with-target
        with:
          artifact-name: build-target-${{ needs.plan-platforms.outputs.arch }}

      # ── 发布型平台（spk/fpk 等）：执行注册表里声明的打包命令 ──
      - name: 打包（${{ matrix.name }}）
        if: matrix.changed && matrix.publish == 'release'
        shell: bash
        run: |
          set -euo pipefail
          echo "执行: ${{ matrix.build }}"
          ${{ matrix.build }}

      - name: 出货级验包（载荷 + 原生实体）
        if: matrix.changed && matrix.publish == 'release'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for PKG in build/staging/*.spk build/staging/*.fpk; do
            echo "── 验包: $PKG"
            python3 scripts/guards/check-native-entity.py "$PKG" --arch "$ARCH"
          done
          for FPK in build/staging/*.fpk; do
            python3 scripts/guards/check-fpk-payload.py "$FPK" \
              --expect-pkg commander --expect-pkg js-yaml --expect-pkg @deepseek-ai/cordis
          done

      - name: 收集产物
        if: matrix.changed && matrix.publish == 'release'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for pattern in ${{ join(matrix.artifacts, ' ') }}; do
            cp -a $pattern dist/ 2>/dev/null || true
          done
          ls -lh dist || true

      - uses: actions/upload-artifact@v7
        if: matrix.changed && matrix.publish == 'release'
        with:
          name: platform-${{ matrix.name }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: matrix.changed && matrix.publish == 'registry'
        with:
          name: image-ref-${{ matrix.name }}-${{ needs.plan-platforms.outputs.arch }}
          path: dist/image-ref-*.txt
          retention-days: 3
          if-no-files-found: error

      # ── 镜像型平台（docker 等）：调注册表里声明的构建命令，脚本内部负责推+冒烟 ──
      - name: 构建镜像（${{ matrix.name }}）
        if: matrix.changed && matrix.publish == 'registry'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          out="$(${{ matrix.build }} build/master-build/build/target \
            --arch "$ARCH" --push --registry "$REGISTRY" --image "$IMAGE")"
          printf '%s\n' "$out"
          ref="$(printf '%s\n' "$out" | grep -m1 '^IMAGE_REF=' | cut -d= -f2-)"
          [ -n "$ref" ] || { echo "✗ 没拿到镜像引用"; exit 1; }
          mkdir -p dist
          printf '%s\n' "$ref" > "dist/image-ref-${ARCH}.txt"

  # ── 多架构 manifest（仅当有 registry 型平台且两个架构都产出时）──────────────
  manifest:
    name: 合并 manifest
    needs: [plan-platforms, pack]
    if: >-
      always() && needs.plan-platforms.result == 'success'
      && needs.plan-platforms.outputs.dry_run != 'true'
      && needs.plan-platforms.outputs.has_registry == 'true'
      && needs.pack.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: 下载镜像引用
        uses: actions/download-artifact@v8
        with:
          pattern: image-ref-*
          path: refs
          merge-multiple: true
        continue-on-error: true

      - name: 计算版本
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          # 版本从 build-image.sh 落下的 IMAGE_REF 取（形如 ghcr.io/ns/name:<版本>-amd64），
          #   不靠猜 tag 格式，也不依赖 spk 平台本次是否构建
          ref="$(cat refs/image-ref-*.txt 2>/dev/null | head -1)"
          [ -n "$ref" ] || { echo "✗ 没拿到镜像引用"; exit 1; }
          ver="$(printf '%s' "$ref" | sed -E 's/.*:([^-]+(-[a-z]+\.[0-9]+)?)-(amd64|arm64)$/\1/')"
          [ -n "$ver" ] || { echo "✗ 无法从 $ref 解析版本"; exit 1; }
          echo "PKG_VER=$ver" >> "$GITHUB_OUTPUT"
          echo "版本: $ver（来自 $ref）"
      - name: 登录并合并
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          ver="${{ steps.ver.outputs.PKG_VER }}"
          base="${REGISTRY}/${IMAGE}:${ver}"
          # 只在两个架构 tag 都存在时合并；缺一个就跳过（不制造半成品 manifest）
          have_amd64=0; have_arm64=0
          docker manifest inspect "${base}-amd64" >/dev/null 2>&1 && have_amd64=1 || true
          docker manifest inspect "${base}-arm64" >/dev/null 2>&1 && have_arm64=1 || true
          if [ "$have_amd64" = 1 ] && [ "$have_arm64" = 1 ]; then
            docker buildx imagetools create -t "${base}" "${base}-amd64" "${base}-arm64"
            case "$ver" in
              *-alpha*) docker buildx imagetools create -t "${REGISTRY}/${IMAGE}:alpha" "${base}-amd64" "${base}-arm64" ;;
              *-beta*)  docker buildx imagetools create -t "${REGISTRY}/${IMAGE}:beta"  "${base}-amd64" "${base}-arm64" ;;
              *)        docker buildx imagetools create -t "${REGISTRY}/${IMAGE}:latest" "${base}-amd64" "${base}-arm64" ;;
            esac
            echo "✓ 已合并 ${base}"
          else
            echo "· 只有单架构（amd64=$have_amd64 arm64=$have_arm64），跳过 manifest 合并"
          fi

  # ── 发布（汇总各平台产物，逻辑沿用原 pack-and-release 的发布段）──────────────
  release:
    name: 发布 Release
    needs: [plan-platforms, pack]
    if: >-
      always() && needs.plan-platforms.result == 'success'
      && needs.plan-platforms.outputs.dry_run != 'true'
      && needs.pack.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 下载各平台产物
        uses: actions/download-artifact@v8
        with:
          pattern: platform-*
          path: dist-main
          merge-multiple: true
        # 全部平台都跳过（无变化）时没有 artifact，这一步不该让 job 红
        continue-on-error: true

      - name: 检查产物
        id: check
        shell: bash
        run: |
          set -euo pipefail
          if ls dist-main/* >/dev/null 2>&1; then
            echo "HAS_FILES=yes" >> "$GITHUB_OUTPUT"
            ls -lh dist-main
          else
            echo "HAS_FILES=no" >> "$GITHUB_OUTPUT"
            echo "（无产物，跳过发布）"
          fi
          echo "SPK_STATUS=success" >> "$GITHUB_ENV"
          echo "SPK_DESC=源码链路" >> "$GITHUB_ENV"
          echo "FPK_SOURCE_STATUS=success" >> "$GITHUB_ENV"
          echo "FPK_SOURCE_DESC=源码构建,${{ needs.plan-platforms.outputs.arch == 'arm64' && 'arm' || 'x86' }}" >> "$GITHUB_ENV"
          echo "FPK_NPM_STATUS=skipped" >> "$GITHUB_ENV"
          echo "FPK_NPM_DESC=npm 链路,${{ needs.plan-platforms.outputs.arch == 'arm64' && 'arm' || 'x86' }}" >> "$GITHUB_ENV"
          if ls dist-main/* >/dev/null 2>&1; then
            echo "dist_main_SHA<<EOF" >> "$GITHUB_ENV"
            (cd dist-main && sha256sum *) 2>/dev/null >> "$GITHUB_ENV" || true
            echo "EOF" >> "$GITHUB_ENV"
          fi

      - name: 解析官方 tag
        id: reltag
        shell: bash
        env:
          DS_FETCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.dsh_tag }}" ]; then
            echo "TAG=${{ inputs.dsh_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "TAG=$(./scripts/fetch-dsh-latest.sh --print-tag)" >> "$GITHUB_OUTPUT"
          fi

      - name: 生成 Release 文案 + 标题
        id: note-main
        if: steps.check.outputs.HAS_FILES == 'yes'
        env:
          MODE: main
          TRIGGER: ${{ github.event_name }}
          RELEASE_TAG: ${{ steps.reltag.outputs.TAG }}
          SPK_STATUS: ${{ env.SPK_STATUS }}
          SPK_DESC: ${{ env.SPK_DESC }}
          FPK_SOURCE_STATUS: ${{ env.FPK_SOURCE_STATUS }}
          FPK_SOURCE_DESC: ${{ env.FPK_SOURCE_DESC }}
          SHA256: ${{ env.dist_main_SHA }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 构建时间必须每次现取并内联传给本条命令（写 $GITHUB_ENV 只对后续 step 生效）
          BUILD_TIME="$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S +08:00')" \
            ./build/release-note.sh > /tmp/release-body-main.md
          echo "TITLE=$(./build/release-note.sh title)" >> "$GITHUB_OUTPUT"

      - name: 发布 Release
        if: steps.check.outputs.HAS_FILES == 'yes'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.reltag.outputs.TAG }}
          name: ${{ steps.note-main.outputs.TITLE }}
          body_path: /tmp/release-body-main.md
          files: dist-main/*
          prerelease: false
          fail_on_unmatched_files: false

      - name: 清理旧名资产
        if: steps.check.outputs.HAS_FILES == 'yes' && vars.PRUNE_OLD_ASSETS != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -e
          python3 scripts/prune-release-assets.py \
            --tag "${{ steps.reltag.outputs.TAG }}" \
            --keep-from dist-main

      - name: 校验四资产齐套（缺件告警，不阻断另一架构）
        if: always() && steps.check.outputs.HAS_FILES == 'yes'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/guards/check-release-assets.py \
            --repo "${{ github.repository }}" \
            --tag "${{ steps.reltag.outputs.TAG }}"
