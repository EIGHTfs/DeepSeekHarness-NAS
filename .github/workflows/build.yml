name: Build SPK + FPK (DeepSeekHarness-NAS)

on:
  schedule:
    # 每日自动打包：拉官方最新源码 → 构建 SPK + FPK → 上传 artifact + 自动发布 Release
    # 04:00 UTC = 北京时间 12:00（避开凌晨低谷；artifact 保留 14 天）
    - cron: '0 4 * * *'
  workflow_dispatch:          # 手动触发（Actions 页点按钮）
  push:
    tags: ['v*']              # 打 v* tag 自动触发（并发布 Release）

# 创建/更新 Release 需要写权限
permissions:
  contents: write

# ── 构建开关（仓库变量 vars.BUILD_SPK / vars.BUILD_FPK 控制各产物是否构建）──
#   job 级 if 只能用 vars 上下文（GitHub Actions 限制：if 里不可用 env）。
#   设置方式：仓库 Settings → Secrets and variables → Actions → Variables
#   新增 BUILD_FPK = 'false' 即临时关闭 FPK 构建（不设置或 'true' = 构建）。
#   也可用 API：PUT /repos/{owner}/{repo}/actions/variables/BUILD_FPK
#   默认（变量未设置）两个都构建。
#
# ── FPK 构建方式选择（vars.FPK_MODE）──
#   FPK_MODE = 'npm'  → npm 链路（npm 装官方包 → app_root → --npm 打包，免源码编译，体积更小）
#   FPK_MODE = 未设置/其他 → 源码构建（默认，与 SPK 同源：build-common.sh 编译 target → build-fpk.sh，
#                            品牌 DeepSeekHarness-NAS，2026-09-15 本地实测 114MB 实机可装）
#   设置方式同上：Settings → Variables 新增 FPK_MODE = 'npm'

jobs:
  # ── 群晖 SPK：源码链路（需完整 pnpm install + build + 裁剪）──
  build-spk:
    if: ${{ vars.BUILD_SPK != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 22（打包与运行均需 >=22.19）
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # build-common.sh 默认取 /usr/bin/node（runner 系统旧版），
      # 显式指向 setup-node 装的新版，避免打到 20.x 打包进套件
      - name: 指定打包用 node 路径
        run: echo "NODE_SRC=$(command -v node)" >> "$GITHUB_ENV"

      - name: 拉取官方最新源码到 src/deepseek-ai/{tag}
        run: ./scripts/fetch-dsh-latest.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 清理 runner 磁盘空间（释放 ~20G）
        run: |
          echo "清理前:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          echo "清理后:"
          df -h /

      - name: 环境诊断（磁盘/内存，CI 排查用）
        run: |
          df -h /
          echo "-----"
          free -h
          echo "-----"
          nproc

      # ⚠ 该 job 的日志 GitHub 时常不归档（BlobNotFound）。单步构建（BUILD_STAGE=all）
      #   保证失败时 failure() 能捕获；日志靠 artifact 兜底。
      - name: 公共预编译 pnpm install + build + 裁剪
        run: ./build/build-common.sh

      # 失败时上传完整构建日志（GitHub 日志 blob 经常丢失）
      - name: 失败时上传构建日志（诊断）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-spk-debug-log
          path: |
            build/master-build/build-*/pnpm-build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: 打 SPK
        run: ./build/SPK/build-spk.sh

      - name: 上传 SPK 产物
        uses: actions/upload-artifact@v4
        with:
          name: spk-dist
          path: |
            build/staging/*.spk
          retention-days: 14

  # ── 飞牛 FPK：npm 链路（npm 装官方 dsh 包，无需 monorepo 编译，快、体积小）──
  #    与 build-spk 并行；start.sh 母版、build-config.yaml 两边共用，改一处同步。
  build-fpk:
    if: ${{ vars.BUILD_FPK != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 22（打包与运行均需 >=22.19）
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 指定打包用 node 路径
        run: echo "NODE_SRC=$(command -v node)" >> "$GITHUB_ENV"

      # 源码链路需要完整源码编译；npm 链路只需取版本号对齐（fetch 都跑，保证产物版本一致）
      - name: 拉取官方最新源码到 src/deepseek-ai/{tag}
        run: ./scripts/fetch-dsh-latest.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── FPK 构建方式：vars.FPK_MODE 选择 ──
      #   'npm' = npm 链路（npm 装官方包 → app_root → --npm 打包，免源码编译，体积更小）
      #   其他/未设置 = 源码构建（默认，与 build-spk 同源：build-common.sh 编译 target → build-fpk.sh）
      - name: 清理 runner 磁盘空间（源码构建需要，释放 ~20G）
        if: ${{ vars.FPK_MODE != 'npm' }}
        run: |
          echo "清理前:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          echo "清理后:"
          df -h /

      - name: 环境诊断（磁盘/内存，CI 排查用）
        if: ${{ vars.FPK_MODE != 'npm' }}
        run: |
          df -h /
          echo "-----"
          free -h
          echo "-----"
          nproc

      - name: 公共预编译 pnpm install + build + 裁剪（源码链路）
        if: ${{ vars.FPK_MODE != 'npm' }}
        run: ./build/build-common.sh

      # 失败时上传完整构建日志（GitHub 日志 blob 经常丢失）
      - name: 失败时上传构建日志（诊断）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-fpk-debug-log
          path: |
            build/master-build/build-*/pnpm-build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: 构建 npm 应用体（npm 装官方包 → app_root，npm 链路）
        if: ${{ vars.FPK_MODE == 'npm' }}
        run: ./build/FPK/build-npm-fpk-app.sh

      - name: 打 FPK（源码构建，消费 target）
        if: ${{ vars.FPK_MODE != 'npm' }}
        run: ./build/FPK/build-fpk.sh

      - name: 打 FPK（--npm 消费 app_root，npm 链路）
        if: ${{ vars.FPK_MODE == 'npm' }}
        run: ./build/FPK/build-fpk.sh --npm

      - name: 上传 FPK 产物
        uses: actions/upload-artifact@v4
        with:
          name: fpk-dist
          path: |
            build/staging/*.fpk
          retention-days: 14

  # ── 自动发布 Release（与官方同 tag；spk 缺失时先发 fpk，修好后再补）──
  #   任何触发（定时/手动/tag）都走这里：产物构建完成后，解析官方最新 tag
  #   （fetch-dsh-latest.sh --print-tag，与官方 dsh 版本对齐），同名 tag 的
  #   Release 已存在则覆盖资产（滚动刷新），不存在则自动创建。
  release:
    needs: [build-spk, build-fpk]
    # always() 容忍 build-spk 失败：有 fpk 就先发布，Release 说明里标注 spk 缺失
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 解析官方最新 tag（与官方同 tag 发布）
        id: reltag
        run: echo "TAG=$(./scripts/fetch-dsh-latest.sh --print-tag)" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 下载产物（spk 可能缺失，容忍失败）
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: '*-dist'
          merge-multiple: true
        continue-on-error: true

      - name: 检查产物 + 记录 spk/fpk 状态 + 计算 SHA256
        id: check
        run: |
          if ls dist/* >/dev/null 2>&1; then
            echo "HAS_FILES=yes" >> "$GITHUB_OUTPUT"
            ls -lh dist
          else
            echo "HAS_FILES=no" >> "$GITHUB_OUTPUT"
            echo "（无任何产物，跳过发布）"
          fi
          if [ "${{ needs.build-spk.result }}" = "success" ]; then
            echo "SPK_STATUS=✅ 有（源码链路构建成功）" >> "$GITHUB_ENV"
          elif [ "${{ needs.build-spk.result }}" = "skipped" ]; then
            echo "SPK_STATUS=⏭️ 跳过（BUILD_SPK=false）" >> "$GITHUB_ENV"
          else
            echo "SPK_STATUS=❌ 缺失（源码链路 CI 失败，修复中）" >> "$GITHUB_ENV"
          fi
          if [ "${{ needs.build-fpk.result }}" = "success" ]; then
            if [ "${{ vars.FPK_MODE }}" = "npm" ]; then
              echo "FPK_STATUS=✅ 有（npm 链路，x86）" >> "$GITHUB_ENV"
            else
              echo "FPK_STATUS=✅ 有（源码构建，x86）" >> "$GITHUB_ENV"
            fi
          elif [ "${{ needs.build-fpk.result }}" = "skipped" ]; then
            echo "FPK_STATUS=⏭️ 跳过（BUILD_FPK=false）" >> "$GITHUB_ENV"
          else
            if [ "${{ vars.FPK_MODE }}" = "npm" ]; then
              echo "FPK_STATUS=❌ 缺失（npm 链路 CI 失败）" >> "$GITHUB_ENV"
            else
              echo "FPK_STATUS=❌ 缺失（源码构建 CI 失败）" >> "$GITHUB_ENV"
            fi
          fi
          # 产物 SHA256 校验值（发布描述自带，作验证依据）
          if ls dist/* >/dev/null 2>&1; then
            {
              echo 'RELEASE_SHA<<EOF'
              (cd dist && sha256sum *) 2>/dev/null
              echo 'EOF'
            } >> "$GITHUB_ENV"
          fi

      - name: 发布 Release（tag=官方 tag；已有同名则覆盖资产）
        if: steps.check.outputs.HAS_FILES == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.reltag.outputs.TAG }}
          name: "${{ steps.reltag.outputs.TAG }} 自动构建"
          body: |
            自动构建产物（触发方式: ${{ github.event_name }}）
            - 官方版本: ${{ steps.reltag.outputs.TAG }}
            - FPK: ${{ env.FPK_STATUS }}
            - SPK: ${{ env.SPK_STATUS }}
            - 构建时间: ${{ github.event.repository.updated_at }}
            - SHA256 校验:
            ```
            ${{ env.RELEASE_SHA }}
            ```
          files: dist/*
          prerelease: ${{ contains(steps.reltag.outputs.TAG, '-') }}
          fail_on_unmatched_files: false
