name: Build SPK + FPK (DeepSeekHarness-NAS)

on:
  # 已删除「每日 04:00 UTC」定时触发。
  #   原因：看门狗 watch-official.yml 每 30 分钟比对官方 tag，且**成功后暂停 6 小时**；
  #   而每日 cron 是【无条件】构建 → 若上次成功在 1 小时前，它照样跑 → 直接破坏 6 小时规则。
  #   看门狗本身就是 48 次/天的兜底，cron 的兜底价值已归零；且同一 tag 重建只会浪费 20 分钟。
  #   现在触发只剩：① 看门狗自动对齐 ② Actions 页手动 workflow_dispatch ③ 推送 v* tag。
  workflow_dispatch:          # 手动触发（Actions 页点按钮）
    inputs:
      dsh_tag:
        description: '指定官方 tag（如 dsh-v<版本>）；留空 = 官方最新。用于补全历史版本的 FPK/SPK'
        required: false
        default: ''
      arch:
        description: '目标架构：x86_64（默认）或 arm64（→ SPK arch=armv8 / FPK platform=arm）'
        required: false
        type: choice
        options: ['x86_64', 'arm64']
        default: 'x86_64'
  push:
    tags: ['v*']              # 打 v* tag 自动触发（并发布 Release）

  # 供批量工作流（rebuild-many.yml）以 matrix 逐组合调用。
  #   为什么需要：批量重建多个官方 tag 时，一个 tag 一个 job 最省事；
  #   若改成「一个 job 内循环多个 tag」，每轮都要重置工作区，既慢又容易残留。
  #   注意：workflow_call 的 inputs 只能声明为 string/boolean/number（无 choice）。
  workflow_call:
    inputs:
      dsh_tag:
        description: '官方 tag（如 dsh-v<版本>）；留空 = 官方最新'
        required: false
        type: string
        default: ''
      arch:
        description: '目标架构：x86_64 或 arm64'
        required: false
        type: string
        default: 'x86_64'

# 创建/更新 Release 需要写权限
permissions:
  contents: write
  # 方案 B：构建失败时自动学习缺失依赖并【入库】，随后 dispatch 一次重建。
  # dispatch workflow 需要 actions: write。
  actions: write
# 同一份构建不重复跑 —— 新运行主动停掉还在跑的同一个。
# 但「同一个」的粒度必须含 tag：不同官方 tag 是不同产物，曾经因为 group 只有 arch，
#   批量重建多个 tag 时后来的直接把前面的取消掉（实测：连发两个 tag，只剩最后一个）。
# 故 group 里加入 tag（dispatch 用 inputs.dsh_tag；push/tag 触发用 ref_name 兜底）。
concurrency:
  group: ${{ github.workflow }}-${{ inputs.arch || 'x86_64' }}-${{ inputs.dsh_tag || github.ref_name }}
  cancel-in-progress: true



# ── 构建开关（仓库变量 vars.* 控制；未设置均默认构建）───────────────────────
#   BUILD_SPK = 'false'   关闭 SPK 构建（不设置或 'true' = 构建）
#   BUILD_FPK = 'false'   关闭 FPK 构建
#   PRUNE_OLD_ASSETS = 'false'  关闭「清理 Release 里改名后残留的旧产物资产」
#       （不设置或 'true' = 清理，即**默认启用**）。
#       背景：action-gh-release 只替换同名资产，产物改名后旧名字会残留（实测同一 Release
#       挂过新旧两个 SPK）。清理规则见 scripts/prune-release-assets.py 头部注释：
#       只清理「本次确实产出过的类别」，未产出的类别一律不动（BUILD_FPK=false 时不会误删 FPK）。
#   FPK 链路：**源码构建 + npm 链路一律都构建**
#       原先由 vars.FPK_MODE（both/source/npm）选择，现取消该参数：
#       两条链路产物用途不同（源码版验证完整链路；npm 版体积小、装得快），
#       单链路开关只会让 Release 缺项、文案出现"跳过"，故固定都构建。
#       要少跑一条链路请直接改本文件（临时排障），不要恢复成仓库变量开关。
#   设置方式：Settings → Secrets and variables → Actions → Variables；
#   也可用 API：PUT /repos/{owner}/{repo}/actions/variables/{NAME}

jobs:
  # ── 群晖 SPK：源码链路（需完整 pnpm install + build + 裁剪）──
  build-target:
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}

    steps:
      - uses: actions/checkout@v5

      - name: 守卫套件（README 覆盖度 / 公共函数唯一性 / 破坏性操作 / 命名 / 构建配置 / 打包不变量）
        run: |
          set -e
          python3 scripts/check-workflow-yaml.py
          python3 scripts/check-readme-coverage.py
          python3 scripts/check-common-functions.py
          python3 scripts/check-destructive-ops.py
          python3 scripts/check-build-naming.py
          python3 scripts/check-build-config.py
          python3 scripts/check-packaging-invariants.py
          # 学习器回归（dry-run，夹具见 test/fixtures/learner/）
          bash test/learner-dryrun.test.sh
          # Release 资产清理回归（架构维度，见 test/prune-release-assets.test.sh）
          bash test/prune-release-assets.test.sh
          bash test/safe-rm-rf.test.sh

      # 唯一构建：install + build + 裁剪一次做完，target 作为 artifact 传给各打包 job
      - uses: ./.github/actions/build-target
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          dsh_tag: ${{ inputs.dsh_tag }}
          arch: ${{ inputs.arch }}

      # 产物架构自检（出包前最后一道闸）
      # 为什么必须有：曾出现 x86_64 安装包里塞进 arm64 的 bin/node 与 linux-arm64 原生模块
      #   —— 起因是两架构并行构建共用了不含架构的 target 缓存。这类产物能装、文件齐、
      #   结构对比与 sha256 全部正常，要等套件起不来或运行期第一次走 flock 才暴露。
      #   这里用 ELF 头把 bin/node 的 e_machine 钉死，并核对 native 平台目录是否为目标架构。
      # 路径依据（不是推断）：build-target/action.yml 第 159-160 行明确校验 `build/master-build/build/target`
      #   存在且是唯一的 target 位置；`find` 那版写法在 CI 上没命中（日志已归档拿不到原因），
      #   所以改回这个被 action 自己断言过的固定路径，并先打印目录内容 —— 万一再失败，
      #   日志能直接看出「路径不对」还是「target 里真没有 bin/node」。
      - name: 校验产物架构与目标一致
        shell: bash
        run: |
          set -e
          target_dir="build/master-build/build/target"
          echo "目标架构: ${{ inputs.arch }}"
          echo "target 目录: $target_dir"
          if [ ! -d "$target_dir" ]; then
            echo "✗ target 目录不存在，实测 build/master-build 结构如下：" >&2
            ls -la build/master-build 2>/dev/null >&2 || true
            find build/master-build -maxdepth 3 -type d -name target 2>/dev/null >&2 || true
            exit 1
          fi
          echo "—— bin 目录 ——"
          ls -la "$target_dir/bin" 2>/dev/null || echo "（无 bin 目录）"
          echo "—— native 平台目录 ——"
          ls -1 "$target_dir/native/system/packages" 2>/dev/null || echo "（无 native/system/packages）"
          python3 scripts/check-target-arch.py "$target_dir" --arch "${{ inputs.arch }}"

      # ── 方案 B：构建失败时自动学习缺失依赖并入库 ──────────────
      # 为什么需要：上游新增构建期脚本可能 import 被裁剪剥掉的根 devDep（实测某 alpha 版的
      #   scripts/primary-runtime/prune-python-tests.ts → papaparse → TS2307 构建挂掉），
      #   而学习器此前只靠人工调用。这里接上闭环：学 → 入库 → 自动重建一次。
      # 边界：只从【真实失败日志】学（--log 模式，抓 Cannot find module 'X'），不猜；
      #   白名单无变化就绝不提交（说明这次失败不是缺包导致）→ 不会造成重建死循环。
      - name: 自动学习缺失依赖并入库（方案 B）
        id: selfheal
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 本步会 git commit：显式关掉 lefthook 提交钩子（构建期不需要跑钩子；
          # 钩子找不到可执行文件时会继续向上兜底扫描，失效路径下可能拖住整步）
          LEFTHOOK: '0'
        run: |
          set -uo pipefail
          LOGS=$(ls -1t build/master-build/*.log assets/pnpm-install.log 2>/dev/null | head -3 || true)
          if [ -z "${LOGS:-}" ]; then
            echo "… 未找到构建日志（build/master-build/*.log、assets/pnpm-install.log），跳过自动学习"
            exit 0
          fi
          echo "… 从失败日志自动学习（$LOGS）…"
          for L in $LOGS; do
            bash scripts/learn-prune-whitelist.sh --log "$L" --apply || true
          done
          if git diff --quiet -- build/build-prune-whitelist.json; then
            echo "… 白名单无变化（本次失败不是缺包导致）→ 不提交、不重建"
            exit 0
          fi
          git config user.name EIGHTfs
          git config user.email EIGHTfs@users.noreply.github.com
          git add build/build-prune-whitelist.json
          git commit -q -m "chore(prune): CI 自动学习并入构建必需包（方案 B）"
          git --no-pager diff --stat HEAD~1 -- build/build-prune-whitelist.json || true
          # ★ 先写输出再推送（实测教训）：原顺序是 push 在前，一旦 push 被拒
          #   （并发提交很正常：人手推的修复可能刚落到 main），本步被标 failure →
          #   changed 从未写出 → "入库后自动重建"那步的 if 不成立 → 直接 skipped，
          #   学到的白名单条目随被拒的提交一起丢失。
          echo "changed=yes" >> "$GITHUB_OUTPUT"
          # push 抗竞争：先把远端新提交 rebase 进来再推；失败也不阻断（输出已写出，
          # 重建会用远端最新 main —— 那里可能已经含有人手推的同名修复）。
          git fetch -q origin main || true
          git rebase -q origin/main || { git rebase --abort 2>/dev/null || true; }
          git push origin HEAD:main || echo "  ⚠ push 被拒（远端已有新提交）→ 不阻断；重建将使用远端最新 main"
          echo "… 已入库（或远端已有更新），下一步自动重建一次 …"
          exit 0

      - name: 入库后自动重建一次
        # ★ 必须用 always()（实测教训）：只用 failure() 时，一旦上一步自身被判失败，
        #   这一步会被 skipped（实测 #84：自学步 failure → 重建步 skipped → 白名单条目丢失）。
        #   always() 保证"只要自愈确实改了白名单"就一定重建。
        if: always() && steps.selfheal.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          curl -sS -o /dev/null -w '  触发重建 HTTP %{http_code}\n' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/dispatches" \
            -d '{"ref":"main"}'

  # ── 打包：SPK · 源码链路（复用 build-target 的 artifact，不重复构建）──────────
  pack-and-release:
    needs: [build-target]
    env:
      ARCH: ${{ inputs.arch }}
    # 构建失败时不跑（口径：宁失败不发缺项；artifact 缺失时本就无法打包）
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      # ── 打包（复用 build-target 的 artifact，不重复构建）──
      - uses: ./.github/actions/pack-with-target

      - name: 打 SPK（源码链路）
        run: ./build/SPK/pack-spk.sh

      - name: 打 FPK（源码链路）
        run: ./build/FPK/pack-fpk.sh

      - name: 汇总产物到 dist-main（供后续检查与发布）
        run: |
          set -e
          # dist-npm 仅为兼容后续检查步骤而建空目录（FPK npm 链路已留档、CI 不执行）
          mkdir -p dist-main dist-npm
          cp -a build/staging/*.spk build/staging/*.fpk dist-main/ 2>/dev/null || true
          ls -lh dist-main || true

      - name: 出货级验包（载荷检查；不合格即失败）
        run: |
          set -e
          FPK="$(ls -t build/staging/*.fpk 2>/dev/null | head -1)"
          if [ -z "$FPK" ]; then echo "✗ 没有产出 fpk"; exit 1; fi
          echo "验包: $FPK"
          python3 scripts/check-fpk-payload.py "$FPK" \
            --expect-pkg commander --expect-pkg js-yaml --expect-pkg @deepseek-ai/cordis

      - name: 解析官方 tag（指定则用指定值，与官方同 tag 发布）
        id: reltag
        run: |
          if [ -n "${{ inputs.dsh_tag }}" ]; then
            echo "TAG=${{ inputs.dsh_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "TAG=$(./scripts/fetch-dsh-latest.sh --print-tag)" >> "$GITHUB_OUTPUT"
          fi
        env:
          DS_FETCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 按链路分别下载到各自目录：两条链路产物不再共用一个 artifact、也不再靠
      # 文件名（*-npm.fpk）分拣
      - name: 检查产物 + 记录状态 + 计算 SHA256
        id: check
        run: |
          # 两条链路各自独立 artifact，已分别落在 dist-main / dist-npm
          has_main=no; ls dist-main/* >/dev/null 2>&1 && has_main=yes
          has_npm=no;  ls dist-npm/*  >/dev/null 2>&1 && has_npm=yes
          echo "HAS_MAIN=$has_main" >> "$GITHUB_ENV"
          echo "HAS_NPM=$has_npm"   >> "$GITHUB_ENV"
          if [ "$has_main" = yes ] || [ "$has_npm" = yes ]; then
            echo "HAS_FILES=yes" >> "$GITHUB_OUTPUT"
            ls -lh dist-main dist-npm 2>/dev/null || true
          else
            echo "HAS_FILES=no" >> "$GITHUB_OUTPUT"
            echo "（无任何产物，跳过发布）"
          fi
          # 状态徽标数据：拆分后每条链各自 job 的结果，互不牵连
          _status() { case "$1" in success) echo success ;; skipped) echo skipped ;; *) echo fail ;; esac; }
          # 修正：job 重构后已无 build-spk/build-fpk-source 等旧 job，
          #   needs.*.result 求值为空 → _status 落到 *) fail → 正文被写成"❌ 缺失"。
          #   本 job 依赖 build-target 成功才会运行，故源码链路两个产物即 success；
          #   npm 链路按设计留档不执行 → skipped。
          echo "SPK_STATUS=success" >> "$GITHUB_ENV"
          echo "SPK_DESC=源码链路" >> "$GITHUB_ENV"
          echo "FPK_SOURCE_STATUS=success" >> "$GITHUB_ENV"
          echo "FPK_SOURCE_DESC=源码构建,${{ inputs.arch == 'arm64' && 'arm' || 'x86' }}" >> "$GITHUB_ENV"
          echo "FPK_NPM_STATUS=skipped" >> "$GITHUB_ENV"
          echo "FPK_NPM_DESC=npm 链路,${{ inputs.arch == 'arm64' && 'arm' || 'x86' }}" >> "$GITHUB_ENV"
          # 产物 SHA256 校验值（发布描述自带，作验证依据）
          for _d in dist-main dist-npm; do
            if ls "$_d"/* >/dev/null 2>&1; then
              echo "${_d}_SHA<<EOF" >> "$GITHUB_ENV"
              (cd "$_d" && sha256sum *) 2>/dev/null >> "$GITHUB_ENV" || true
              echo "EOF" >> "$GITHUB_ENV"
            fi
          done

      - name: 生成源码链路 Release 文案 + 标题（release-note.sh MODE=main）
        id: note-main
        if: steps.check.outputs.HAS_FILES == 'yes' && env.HAS_MAIN == 'yes'
        env:
          MODE: main
          TRIGGER: ${{ github.event_name }}
          RELEASE_TAG: ${{ steps.reltag.outputs.TAG }}
          SPK_STATUS: ${{ env.SPK_STATUS }}
          SPK_DESC: ${{ env.SPK_DESC }}
          FPK_SOURCE_STATUS: ${{ env.FPK_SOURCE_STATUS }}
          FPK_SOURCE_DESC: ${{ env.FPK_SOURCE_DESC }}
          SHA256: ${{ env.dist_main_SHA }}
          # 更新日志抓取（api.github.com）带上 token，避免匿名限流
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # ★ 构建时间必须【每次运行现取】+ 必须【内联】传给本条命令 ✗
          #   真机 bug：写成 `echo BUILD_TIME=… >> $GITHUB_ENV` 却与 release-note.sh
          #   在【同一个 step】→ $GITHUB_ENV 只对后续 step 生效 ✗ → 正文里打印成 "构建时间: ?" ✗
          #   另：原用 UTC（date -u）→ 北京时间凌晨的构建会显示成【前一天】✗ → 改用北京时间 ✓
          BUILD_TIME="$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S +08:00')" \
            ./build/release-note.sh > /tmp/release-body-main.md
          echo "TITLE=$(./build/release-note.sh title)" >> "$GITHUB_OUTPUT"

      - name: 生成套件源索引（随 Release 发布，供局域网套件源拉取）
        # 为什么放在发布前、且产出到 dist-main：索引里的 md5/size 必须来自本次真实产物，
        # 只有构建机手上才有 spk。生成成 Release 资产后，局域网那台只要拉几 KB 的 JSON，
        # 不必为了算 md5 去下载上百 MB 的 spk。
        if: steps.check.outputs.HAS_FILES == 'yes'
        run: |
          set -e
          ARGS=()
          for f in dist-main/*.spk; do [ -f "$f" ] && ARGS+=(--spk "$f"); done
          if [ ${#ARGS[@]} -eq 0 ]; then
            echo "无 spk 产物，跳过套件源索引"
            exit 0
          fi
          python3 scripts/gen-pkg-source.py "${ARGS[@]}" \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${{ steps.reltag.outputs.TAG }}" \
            --out-dir dist-main

      - name: 发布源码链路 Release（tag=官方 tag）
        if: steps.check.outputs.HAS_FILES == 'yes'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.reltag.outputs.TAG }}
          # 标题文案由 build/release-note.sh 的 title() 统一控制，workflow 不写字面文案
          name: ${{ steps.note-main.outputs.TITLE }}
          body_path: /tmp/release-body-main.md
          files: dist-main/*
          prerelease: false
          fail_on_unmatched_files: false

      - name: 清理旧名资产（改名后残留；vars.PRUNE_OLD_ASSETS=false 可关闭）
        # 为什么需要：发布用的 action-gh-release 只**替换同名资产**，一旦产物改名
        # （如本次 SPK 从 <ver>.spk 改成 <ver>-alpha.1.spk），旧名字的资产会一直留在 Release 里，
        # 让下载者选错包（实测遇到同一 Release 挂新旧两个 SPK）。
        # 安全规则见脚本注释：只清理「本次确实产出过的类别」（架构+后缀+链路），
        # 未产出的类别一律不动 —— 例如 BUILD_FPK=false 时绝不删上一轮留下的 FPK。
        if: steps.check.outputs.HAS_FILES == 'yes' && vars.PRUNE_OLD_ASSETS != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -e
          python3 scripts/prune-release-assets.py \
            --tag "${{ steps.reltag.outputs.TAG }}" \
            --keep-from dist-main

      # 四资产齐套检查：同一 tag 需要 x86_64 与 arm64 各跑一次构建才凑齐四件。
      #   任一架构失败时，那个 Release 会永久只挂一半资产，而成功那次的 job 是绿的 —— 没人会发现。
      #   这里发布后独立核对四件是否齐全；缺件只告警（失败架构的 job 本来已经红过，
      #   不该让另一个成功架构的 run 也变红）。
      - name: 校验四资产齐套（缺件告警，不阻断另一架构）
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/check-release-assets.py \
            --repo "${{ github.repository }}" \
            --tag "${{ steps.reltag.outputs.TAG }}"
