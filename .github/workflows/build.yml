name: Build SPK + FPK (DeepSeekHarness-NAS)

on:
  schedule:
    # 每日自动打包：拉官方最新源码 → 构建 SPK + FPK → 上传 artifact + 自动发布 Release
    # 04:00 UTC = 北京时间 12:00（避开凌晨低谷；artifact 保留 14 天）
    - cron: '0 4 * * *'
  workflow_dispatch:          # 手动触发（Actions 页点按钮）
  push:
    tags: ['v*']              # 打 v* tag 自动触发（并发布 Release）

# 创建/更新 Release 需要写权限
permissions:
  contents: write

# ── 构建开关（仓库变量 vars.* 控制；未设置均默认构建）───────────────────────
#   BUILD_SPK = 'false'   关闭 SPK 构建（不设置或 'true' = 构建）
#   BUILD_FPK = 'false'   关闭 FPK 构建
#   FPK 链路：**源码构建 + npm 链路一律都构建**（2026-10-03 起）
#       原先由 vars.FPK_MODE（both/source/npm）选择，现取消该参数：
#       两条链路产物用途不同（源码版验证完整链路；npm 版体积小、装得快），
#       单链路开关只会让 Release 缺项、文案出现"跳过"，故固定都构建。
#       要少跑一条链路请直接改本文件（临时排障），不要恢复成仓库变量开关。
#   设置方式：Settings → Secrets and variables → Actions → Variables；
#   也可用 API：PUT /repos/{owner}/{repo}/actions/variables/{NAME}

jobs:
  # ── 群晖 SPK：源码链路（需完整 pnpm install + build + 裁剪）──
  build-spk:
    if: ${{ vars.BUILD_SPK != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 守卫套件（README 覆盖度 / 公共函数唯一性 / 破坏性操作 / 命名 / 事故回归）
        run: |
          set -e
          python3 scripts/check-readme-coverage.py
          python3 scripts/check-common-functions.py
          python3 scripts/check-destructive-ops.py
          python3 scripts/check-build-naming.py
          bash test/safe-rm-rf.test.sh

      - uses: ./.github/actions/setup-node-env

      - uses: ./.github/actions/fetch-latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/ci-clean

      # ⚠ 该 job 的日志 GitHub 时常不归档（BlobNotFound）。单步构建（BUILD_STAGE=all）
      #   保证失败时 failure() 能捕获；日志靠 artifact 兜底。
      - name: 公共预编译 pnpm install + build + 裁剪
        run: ./build/build-common.sh

      - uses: ./.github/actions/upload-build-logs
        with:
          artifact-name: build-spk-debug-log

      - name: 打 SPK
        run: ./build/SPK/build-spk.sh

      - name: 上传 SPK 产物
        uses: actions/upload-artifact@v4
        with:
          name: spk-dist
          path: |
            build/staging/*.spk
          retention-days: 14

  # ── 飞牛 FPK · 源码链路（独立 job）────────────────────────────────────────
  #    与 npm 链路**各自独立 job、独立 artifact、独立 Release**（2026-10-03）：
  #    两条链失败互不阻塞、可并行；产物不再共用一个 fpk-dist 靠文件名分拣。
  #    start.sh 母版、build-config.yaml 两边共用，改一处同步。
  build-fpk-source:
    if: ${{ vars.BUILD_FPK != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-env

      - uses: ./.github/actions/fetch-latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 源码链路需要完整源码编译（npm 链路只取版本号对齐）
      - uses: ./.github/actions/ci-clean

      - name: 公共预编译 pnpm install + build + 裁剪
        run: ./build/build-common.sh

      - name: 打 FPK（源码构建，消费 target）
        run: ./build/FPK/build-fpk.sh

      - uses: ./.github/actions/upload-build-logs
        with:
          artifact-name: build-fpk-source-debug-log

      - name: 上传 FPK 源码版产物
        uses: actions/upload-artifact@v4
        with:
          name: fpk-source-dist
          path: |
            build/staging/*.fpk
          retention-days: 14

  # ── 飞牛 FPK · npm 链路（独立 job，不需要源码编译）────────────────────────
  build-fpk-npm:
    if: ${{ vars.BUILD_FPK != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-env

      # 只取官方版本号对齐（产物版本与源码链一致），不做完整编译
      - uses: ./.github/actions/fetch-latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建 npm 应用体（npm 装官方包 → app_root）
        run: ./build/FPK/build-npm-fpk-app.sh

      - name: 打 FPK（--npm 消费 app_root）
        run: ./build/FPK/build-fpk.sh --npm

      - uses: ./.github/actions/upload-build-logs
        with:
          artifact-name: build-fpk-npm-debug-log

      - name: 上传 FPK npm 版产物
        uses: actions/upload-artifact@v4
        with:
          name: fpk-npm-dist
          path: |
            build/staging/*.fpk
          retention-days: 14

  # ── 自动发布 Release（两条链路分开：各自独立 job / artifact / Release）──
  #   链路①源码：build-spk + build-fpk-source → Release `<官方tag>`（SPK + FPK 源码版）
  #   链路②npm ：build-fpk-npm               → Release `<官方tag>-npm`（FPK npm 版）
  #   任何触发（定时/手动/tag）都走这里：解析官方最新 tag（fetch-dsh-latest.sh
  #   --print-tag，与官方 dsh 版本对齐），同名 tag 的 Release 已存在则覆盖资产。
  #   文案/标题/更新日志统一由 build/release-note.sh 生成
  #   （MODE=main 源码链 / MODE=npm 独立链），workflow 不写任何中文文案。
  release:
    needs: [build-spk, build-fpk-source, build-fpk-npm]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 解析官方最新 tag（与官方同 tag 发布）
        id: reltag
        run: echo "TAG=$(./scripts/fetch-dsh-latest.sh --print-tag)" >> "$GITHUB_OUTPUT"
        env:
          DS_FETCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 按链路分别下载到各自目录：两条链路产物不再共用一个 artifact、也不再靠
      # 文件名（*-npm.fpk）分拣（2026-10-03）
      - name: 下载源码链路产物（SPK + FPK 源码版）
        uses: actions/download-artifact@v4
        with:
          name: spk-dist
          path: dist-main
        continue-on-error: true

      - name: 下载源码链路产物（FPK 源码版）
        uses: actions/download-artifact@v4
        with:
          name: fpk-source-dist
          path: dist-main
        continue-on-error: true

      - name: 下载 npm 链路产物（FPK npm 版）
        uses: actions/download-artifact@v4
        with:
          name: fpk-npm-dist
          path: dist-npm
        continue-on-error: true

      - name: 检查产物 + 记录状态 + 计算 SHA256
        id: check
        run: |
          # 两条链路各自独立 artifact，已分别落在 dist-main / dist-npm
          has_main=no; ls dist-main/* >/dev/null 2>&1 && has_main=yes
          has_npm=no;  ls dist-npm/*  >/dev/null 2>&1 && has_npm=yes
          echo "HAS_MAIN=$has_main" >> "$GITHUB_ENV"
          echo "HAS_NPM=$has_npm"   >> "$GITHUB_ENV"
          if [ "$has_main" = yes ] || [ "$has_npm" = yes ]; then
            echo "HAS_FILES=yes" >> "$GITHUB_OUTPUT"
            ls -lh dist-main dist-npm 2>/dev/null || true
          else
            echo "HAS_FILES=no" >> "$GITHUB_OUTPUT"
            echo "（无任何产物，跳过发布）"
          fi
          # 状态徽标数据：拆分后每条链各自 job 的结果，互不牵连
          _status() { case "$1" in success) echo success ;; skipped) echo skipped ;; *) echo fail ;; esac; }
          echo "SPK_STATUS=$(_status '${{ needs.build-spk.result }}')" >> "$GITHUB_ENV"
          echo "SPK_DESC=源码链路" >> "$GITHUB_ENV"
          echo "FPK_SOURCE_STATUS=$(_status '${{ needs.build-fpk-source.result }}')" >> "$GITHUB_ENV"
          echo "FPK_SOURCE_DESC=源码构建,x86" >> "$GITHUB_ENV"
          echo "FPK_NPM_STATUS=$(_status '${{ needs.build-fpk-npm.result }}')" >> "$GITHUB_ENV"
          echo "FPK_NPM_DESC=npm 链路,x86" >> "$GITHUB_ENV"
          # 产物 SHA256 校验值（发布描述自带，作验证依据）
          for _d in dist-main dist-npm; do
            if ls "$_d"/* >/dev/null 2>&1; then
              echo "${_d}_SHA<<EOF" >> "$GITHUB_ENV"
              (cd "$_d" && sha256sum *) 2>/dev/null >> "$GITHUB_ENV" || true
              echo "EOF" >> "$GITHUB_ENV"
            fi
          done

      - name: 生成源码链路 Release 文案 + 标题（release-note.sh MODE=main）
        id: note-main
        if: steps.check.outputs.HAS_FILES == 'yes' && env.HAS_MAIN == 'yes'
        env:
          MODE: main
          TRIGGER: ${{ github.event_name }}
          RELEASE_TAG: ${{ steps.reltag.outputs.TAG }}
          SPK_STATUS: ${{ env.SPK_STATUS }}
          SPK_DESC: ${{ env.SPK_DESC }}
          FPK_SOURCE_STATUS: ${{ env.FPK_SOURCE_STATUS }}
          FPK_SOURCE_DESC: ${{ env.FPK_SOURCE_DESC }}
          BUILD_TIME: ${{ github.event.repository.updated_at }}
          SHA256: ${{ env.dist_main_SHA }}
          # 更新日志抓取（api.github.com）带上 token，避免匿名限流
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./build/release-note.sh > /tmp/release-body-main.md
          echo "TITLE=$(./build/release-note.sh title)" >> "$GITHUB_OUTPUT"

      - name: 发布源码链路 Release（tag=官方 tag）
        if: steps.check.outputs.HAS_FILES == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.reltag.outputs.TAG }}
          # 标题文案由 build/release-note.sh 的 title() 统一控制，workflow 不写字面文案
          name: ${{ steps.note-main.outputs.TITLE }}
          body_path: /tmp/release-body-main.md
          files: dist-main/*
          prerelease: false
          fail_on_unmatched_files: false

      - name: 生成 npm 链路 Release 文案 + 标题（release-note.sh MODE=npm）
        id: note-npm
        if: steps.check.outputs.HAS_FILES == 'yes' && env.HAS_NPM == 'yes'
        env:
          MODE: npm
          TRIGGER: ${{ github.event_name }}
          RELEASE_TAG: ${{ steps.reltag.outputs.TAG }}-npm
          FPK_NPM_STATUS: ${{ env.FPK_NPM_STATUS }}
          FPK_NPM_DESC: ${{ env.FPK_NPM_DESC }}
          BUILD_TIME: ${{ github.event.repository.updated_at }}
          SHA256: ${{ env.dist_npm_SHA }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./build/release-note.sh > /tmp/release-body-npm.md
          echo "TITLE=$(./build/release-note.sh title)" >> "$GITHUB_OUTPUT"

      - name: 发布 npm 链路 Release（tag=官方 tag-npm）
        if: steps.check.outputs.HAS_FILES == 'yes' && env.HAS_NPM == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.reltag.outputs.TAG }}-npm
          name: ${{ steps.note-npm.outputs.TITLE }}
          body_path: /tmp/release-body-npm.md
          files: dist-npm/*
          prerelease: false
          fail_on_unmatched_files: false