name: Build SPK + FPK (DeepSeekHarness-NAS)

on:
  schedule:
    # 每日自动打包：拉官方最新源码 → 构建 SPK + FPK → 上传 artifact + 自动发布 Release
    # 04:00 UTC = 北京时间 12:00（避开凌晨低谷；artifact 保留 14 天）
    - cron: '0 4 * * *'
  workflow_dispatch:          # 手动触发（Actions 页点按钮）
  push:
    tags: ['v*']              # 打 v* tag 自动触发（并发布 Release）

# 创建/更新 Release 需要写权限
permissions:
  contents: write
  # 方案 B（2026-10-09 用户定）：构建失败时自动学习缺失依赖并【入库】，随后 dispatch 一次重建。
  # dispatch workflow 需要 actions: write。
  actions: write
# 用户口径（2026-10-04）：**每次新构建开始前，把上一个正在跑的停掉** ——
# 保证同一时刻只有一个构建（禁并发），也省 runner 分钟（比两个并行更省）。
# 注：曾用 cancel-in-progress: false 试过"排队"，实测会取消正在跑的运行且不排队，故按用户口径
# 明确改为 true（新运行主动停掉旧的）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true



# ── 构建开关（仓库变量 vars.* 控制；未设置均默认构建）───────────────────────
#   BUILD_SPK = 'false'   关闭 SPK 构建（不设置或 'true' = 构建）
#   BUILD_FPK = 'false'   关闭 FPK 构建
#   PRUNE_OLD_ASSETS = 'false'  关闭「清理 Release 里改名后残留的旧产物资产」
#       （不设置或 'true' = 清理，即**默认启用**，用户口径 2026-10-05）。
#       背景：action-gh-release 只替换同名资产，产物改名后旧名字会残留（实测同一 Release
#       挂过新旧两个 SPK）。清理规则见 scripts/prune-release-assets.py 头部注释：
#       只清理「本次确实产出过的类别」，未产出的类别一律不动（BUILD_FPK=false 时不会误删 FPK）。
#   FPK 链路：**源码构建 + npm 链路一律都构建**（2026-10-03 起）
#       原先由 vars.FPK_MODE（both/source/npm）选择，现取消该参数：
#       两条链路产物用途不同（源码版验证完整链路；npm 版体积小、装得快），
#       单链路开关只会让 Release 缺项、文案出现"跳过"，故固定都构建。
#       要少跑一条链路请直接改本文件（临时排障），不要恢复成仓库变量开关。
#   设置方式：Settings → Secrets and variables → Actions → Variables；
#   也可用 API：PUT /repos/{owner}/{repo}/actions/variables/{NAME}

jobs:
  # ── 群晖 SPK：源码链路（需完整 pnpm install + build + 裁剪）──
  build-target:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 守卫套件（README 覆盖度 / 公共函数唯一性 / 破坏性操作 / 命名 / 构建配置 / 内联 JS / 事故回归）
        run: |
          set -e
          python3 scripts/check-workflow-yaml.py
          python3 scripts/check-readme-coverage.py
          python3 scripts/check-common-functions.py
          python3 scripts/check-destructive-ops.py
          python3 scripts/check-build-naming.py
          python3 scripts/check-build-config.py
          python3 scripts/check-html-inline-js.py
          bash test/safe-rm-rf.test.sh

      # 唯一构建：install + build + 裁剪一次做完，target 作为 artifact 传给各打包 job
      - uses: ./.github/actions/build-target
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 方案 B：构建失败时自动学习缺失依赖并入库（用户 2026-10-09 定）──────────────
      # 为什么需要：官方新增构建期脚本可能 import 被裁剪剥掉的根 devDep（实测 alpha.2 的
      #   scripts/primary-runtime/prune-python-tests.ts → papaparse → TS2307 构建挂掉），
      #   而学习器此前只靠人工调用。这里接上闭环：学 → 入库 → 自动重建一次。
      # 边界：只从【真实失败日志】学（--log 模式，抓 Cannot find module 'X'），不猜；
      #   白名单无变化就绝不提交（说明这次失败不是缺包导致）→ 不会造成重建死循环。
      - name: 自动学习缺失依赖并入库（方案 B）
        id: selfheal
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          LOGS=$(ls -1t build/master-build/*.log assets/pnpm-install.log 2>/dev/null | head -3 || true)
          if [ -z "${LOGS:-}" ]; then
            echo "… 未找到构建日志（build/master-build/*.log、assets/pnpm-install.log），跳过自动学习"
            exit 0
          fi
          echo "… 从失败日志自动学习（$LOGS）…"
          for L in $LOGS; do
            bash scripts/learn-prune-whitelist.sh --log "$L" --apply || true
          done
          if git diff --quiet -- build/build-prune-whitelist.json; then
            echo "… 白名单无变化（本次失败不是缺包导致）→ 不提交、不重建"
            exit 0
          fi
          git config user.name EIGHTfs
          git config user.email EIGHTfs@users.noreply.github.com
          git add build/build-prune-whitelist.json
          git commit -q -m "chore(prune): CI 自动学习并入构建必需包（方案 B）"
          git --no-pager diff --stat HEAD~1 -- build/build-prune-whitelist.json || true
          # ★ 先写输出再推送（2026-10-09 实测教训）：原顺序是 push 在前，一旦 push 被拒
          #   （并发提交很正常：人手推的修复可能刚落到 main），本步被标 failure →
          #   changed 从未写出 → "入库后自动重建"那步的 if 不成立 → 直接 skipped，
          #   学到的白名单条目随被拒的提交一起丢失。
          echo "changed=yes" >> "$GITHUB_OUTPUT"
          # push 抗竞争：先把远端新提交 rebase 进来再推；失败也不阻断（输出已写出，
          # 重建会用远端最新 main —— 那里可能已经含有人手推的同名修复）。
          git fetch -q origin main || true
          git rebase -q origin/main || { git rebase --abort 2>/dev/null || true; }
          git push origin HEAD:main || echo "  ⚠ push 被拒（远端已有新提交）→ 不阻断；重建将使用远端最新 main"
          echo "… 已入库（或远端已有更新），下一步自动重建一次 …"
          exit 0

      - name: 入库后自动重建一次
        # ★ 必须用 always()（2026-10-09 实测教训）：只用 failure() 时，一旦上一步自身被判失败，
        #   这一步会被 skipped（实测 #84：自学步 failure → 重建步 skipped → 白名单条目丢失）。
        #   always() 保证"只要自愈确实改了白名单"就一定重建。
        if: always() && steps.selfheal.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          curl -sS -o /dev/null -w '  触发重建 HTTP %{http_code}\n' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/dispatches" \
            -d '{"ref":"main"}'

  # ── 打包：SPK · 源码链路（复用 build-target 的 artifact，不重复构建）──────────
  pack-and-release:
    needs: [build-target]
    # 构建失败时不跑（口径：宁失败不发缺项；artifact 缺失时本就无法打包）
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # ── 打包（复用 build-target 的 artifact，不重复构建）──
      - uses: ./.github/actions/pack-with-target

      - name: 打 SPK（源码链路）
        run: ./build/SPK/pack-spk.sh

      - name: 打 FPK（源码链路）
        run: ./build/FPK/pack-fpk.sh

      - name: 汇总产物到 dist-main（供后续检查与发布）
        run: |
          set -e
          # dist-npm 仅为兼容后续检查步骤而建空目录（FPK npm 链路已留档、CI 不执行）
          mkdir -p dist-main dist-npm
          cp -a build/staging/*.spk build/staging/*.fpk dist-main/ 2>/dev/null || true
          ls -lh dist-main || true

      - name: 解析官方最新 tag（与官方同 tag 发布）
        id: reltag
        run: echo "TAG=$(./scripts/fetch-dsh-latest.sh --print-tag)" >> "$GITHUB_OUTPUT"
        env:
          DS_FETCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 按链路分别下载到各自目录：两条链路产物不再共用一个 artifact、也不再靠
      # 文件名（*-npm.fpk）分拣（2026-10-03）
      - name: 检查产物 + 记录状态 + 计算 SHA256
        id: check
        run: |
          # 两条链路各自独立 artifact，已分别落在 dist-main / dist-npm
          has_main=no; ls dist-main/* >/dev/null 2>&1 && has_main=yes
          has_npm=no;  ls dist-npm/*  >/dev/null 2>&1 && has_npm=yes
          echo "HAS_MAIN=$has_main" >> "$GITHUB_ENV"
          echo "HAS_NPM=$has_npm"   >> "$GITHUB_ENV"
          if [ "$has_main" = yes ] || [ "$has_npm" = yes ]; then
            echo "HAS_FILES=yes" >> "$GITHUB_OUTPUT"
            ls -lh dist-main dist-npm 2>/dev/null || true
          else
            echo "HAS_FILES=no" >> "$GITHUB_OUTPUT"
            echo "（无任何产物，跳过发布）"
          fi
          # 状态徽标数据：拆分后每条链各自 job 的结果，互不牵连
          _status() { case "$1" in success) echo success ;; skipped) echo skipped ;; *) echo fail ;; esac; }
          # 2026-10-04 修正：job 重构后已无 build-spk/build-fpk-source 等旧 job，
          #   needs.*.result 求值为空 → _status 落到 *) fail → 正文被写成"❌ 缺失"。
          #   本 job 依赖 build-target 成功才会运行，故源码链路两个产物即 success；
          #   npm 链路按用户口径留档不执行 → skipped。
          echo "SPK_STATUS=success" >> "$GITHUB_ENV"
          echo "SPK_DESC=源码链路" >> "$GITHUB_ENV"
          echo "FPK_SOURCE_STATUS=success" >> "$GITHUB_ENV"
          echo "FPK_SOURCE_DESC=源码构建,x86" >> "$GITHUB_ENV"
          echo "FPK_NPM_STATUS=skipped" >> "$GITHUB_ENV"
          echo "FPK_NPM_DESC=npm 链路,x86" >> "$GITHUB_ENV"
          # 产物 SHA256 校验值（发布描述自带，作验证依据）
          for _d in dist-main dist-npm; do
            if ls "$_d"/* >/dev/null 2>&1; then
              echo "${_d}_SHA<<EOF" >> "$GITHUB_ENV"
              (cd "$_d" && sha256sum *) 2>/dev/null >> "$GITHUB_ENV" || true
              echo "EOF" >> "$GITHUB_ENV"
            fi
          done

      - name: 生成源码链路 Release 文案 + 标题（release-note.sh MODE=main）
        id: note-main
        if: steps.check.outputs.HAS_FILES == 'yes' && env.HAS_MAIN == 'yes'
        env:
          MODE: main
          TRIGGER: ${{ github.event_name }}
          RELEASE_TAG: ${{ steps.reltag.outputs.TAG }}
          SPK_STATUS: ${{ env.SPK_STATUS }}
          SPK_DESC: ${{ env.SPK_DESC }}
          FPK_SOURCE_STATUS: ${{ env.FPK_SOURCE_STATUS }}
          FPK_SOURCE_DESC: ${{ env.FPK_SOURCE_DESC }}
          BUILD_TIME: ${{ github.event.repository.updated_at }}
          SHA256: ${{ env.dist_main_SHA }}
          # 更新日志抓取（api.github.com）带上 token，避免匿名限流
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./build/release-note.sh > /tmp/release-body-main.md
          echo "TITLE=$(./build/release-note.sh title)" >> "$GITHUB_OUTPUT"

      - name: 发布源码链路 Release（tag=官方 tag）
        if: steps.check.outputs.HAS_FILES == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.reltag.outputs.TAG }}
          # 标题文案由 build/release-note.sh 的 title() 统一控制，workflow 不写字面文案
          name: ${{ steps.note-main.outputs.TITLE }}
          body_path: /tmp/release-body-main.md
          files: dist-main/*
          prerelease: false
          fail_on_unmatched_files: false

      - name: 清理旧名资产（改名后残留；vars.PRUNE_OLD_ASSETS=false 可关闭）
        # 为什么需要：发布用的 action-gh-release 只**替换同名资产**，一旦产物改名
        # （如本次 SPK 从 <ver>.spk 改成 <ver>-alpha.1.spk），旧名字的资产会一直留在 Release 里，
        # 让下载者选错包（实测遇到同一 Release 挂新旧两个 SPK）。
        # 安全规则见脚本注释：只清理「本次确实产出过的类别」（架构+后缀+链路），
        # 未产出的类别一律不动 —— 例如 BUILD_FPK=false 时绝不删上一轮留下的 FPK。
        if: steps.check.outputs.HAS_FILES == 'yes' && vars.PRUNE_OLD_ASSETS != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -e
          python3 scripts/prune-release-assets.py \
            --tag "${{ steps.reltag.outputs.TAG }}" \
            --keep-from dist-main
