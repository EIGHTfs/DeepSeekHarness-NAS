name: setup-node-env
description: 按官方 engines.node 自动选 Node 版本安装，并指定打包用 NODE_SRC（build-spk/build-fpk 共用）
inputs:
  node-version:
    description: 显式指定 Node 大版本（留空 = 自动读官方 engines.node 推导）
    required: false
    default: ''
  dsh-tag:
    description: 官方 tag（留空 = 自动判定最新；与 build-target 解析结果保持一致）
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: 解析应安装的 Node 版本（显式指定优先，否则读官方 engines.node）
      id: nodever
      shell: bash
      env:
        EXPLICIT: ${{ inputs.node-version }}
        DSH_TAG: ${{ inputs.dsh-tag }}
      run: |
        set -e
        if [ -n "$EXPLICIT" ]; then
          echo "node-version=$EXPLICIT（显式指定）" >&2
          echo "version=$EXPLICIT" >> "$GITHUB_OUTPUT"
        else
          ARGS=(--print-engines-node)
          [ -n "$DSH_TAG" ] && ARGS+=(--tag "$DSH_TAG")
          V="$(bash ./scripts/fetch-dsh-latest.sh "${ARGS[@]}")"
          echo "node-version=$V（来自官方 engines.node）" >&2
          echo "version=$V" >> "$GITHUB_OUTPUT"
        fi

    - name: 安装 Node（版本随官方 engines 走）
      uses: actions/setup-node@v7
      with:
        node-version: ${{ steps.nodever.outputs.version }}

    # build-common.sh 默认取 /usr/bin/node（runner 系统旧版），
    # 显式指向 setup-node 装的新版，避免打到 20.x 打包进套件
    - name: 指定打包用 node 路径
      shell: bash
      run: echo "NODE_SRC=$(command -v node)" >> "$GITHUB_ENV"
