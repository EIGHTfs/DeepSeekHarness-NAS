#===============================================================================
# .github/actions/build-target/action.yml — **唯一构建**公共 action
#
# 2026-10-04 在线构建重设计（用户批准方案第 8 步）：
#   原先 `build-spk` 与 `build-fpk-source` **各自逐字重复**一遍
#   「setup-node-env → fetch-latest → ci-clean → build-common.sh」，
#   等于把同一套 install+build+裁剪跑两遍（每次约 20 分钟）。
#   现抽成本 action：**构建只做一次**，产出的 target 作为 artifact 传给各打包 job。
#
# 【调用方约定】
#   · 调用前必须 actions/checkout（本 action 不 checkout，避免重复）
#   · 调用后方可下载 target artifact（见 .github/actions/pack-with-target）
#
# 【产物】artifact 名 `build-target`，内容为 build/master-build/build 下的
#   target/ 与 build-meta.env（打包器消费这两个即可）。
#===============================================================================
name: build-target
description: 唯一构建入口：准备环境 → 拉官方源码 → 预编译 + 裁剪 → 上传 target 供各打包 job 复用

inputs:
  token:
    description: 拉取官方源码/Release 用的 token
    required: false
    default: ${{ github.token }}
  dsh_tag:
    description: 指定官方 tag（如 dsh-v0.1.5-rc.2）；留空 = 官方最新
    required: false
    default: ""
  artifact-name:
    description: target artifact 名称
    required: false
    default: build-target
  retention-days:
    description: artifact 保留天数
    required: false
    default: "7"

runs:
  using: composite
  steps:
    - name: 随包 node / pnpm 环境
      uses: ./.github/actions/setup-node-env

    - name: 解析官方 tag（指定则用指定值，否则取最新；作为 target 复用缓存的 key）
      id: tag
      shell: bash
      run: |
        if [ -n "${{ inputs.dsh_tag }}" ]; then
          echo "tag=${{ inputs.dsh_tag }}" >> "$GITHUB_OUTPUT"
        else
          echo "tag=$(./scripts/fetch-dsh-latest.sh --print-tag)" >> "$GITHUB_OUTPUT"
        fi


    # ── 缓存：官方源码 git 镜像（fetch-dsh-latest.sh 增量拉取的基础）──
    #   key 用仓库 + build-config.yaml 指纹；restore-keys 兜底到最近一次（镜像本身就是增量源，
    #   命中即可只拉增量，未命中则首建镜像）。
    - name: 缓存官方源码 git 镜像
      id: cache-src-mirror
      uses: actions/cache@v4
      with:
        path: src/deepseek-ai/.cache
        key: dsh-src-mirror-${{ github.repository }}-${{ hashFiles('build/build-config.yaml') }}
        restore-keys: |
          dsh-src-mirror-${{ github.repository }}-

    - name: 记录镜像缓存命中情况
      shell: bash
      run: "echo \"源码 git 镜像缓存命中: ${{ steps.cache-src-mirror.outputs.cache-hit }}（true=只拉增量）\""

    - name: 拉取官方源码（增量；可指定 tag）
      uses: ./.github/actions/fetch-latest
      with:
        token: ${{ inputs.token }}
        dsh_tag: ${{ inputs.dsh_tag }}

    - name: 构建目录清理
      uses: ./.github/actions/ci-clean


    # ── 缓存：pnpm store（跨 run 复用已下载的包）──
    #   本仓库根目录无 pnpm-lock.yaml（官方源码才有），故 hashFiles 可能为空；
    #   restore-keys 兜底到最近一次 store，仍能显著减少下载。
    - name: 缓存 pnpm store
      id: cache-pnpm-store
      uses: actions/cache@v4
      with:
        path: assets/pnpm-store
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-

    - name: 记录 pnpm store 缓存命中情况
      shell: bash
      run: |
        echo "pnpm store 缓存命中: ${{ steps.cache-pnpm-store.outputs.cache-hit }}"
        du -sh assets/pnpm-store 2>/dev/null || echo "（store 目录尚未创建，本次为冷启动）"

    # ── 缓存：**已构建好的 target**（真正的"旧产物复用"，2026-10-04 补）──
    #   为什么之前每次都重编 20 分钟：只缓存了输入（源码镜像 / pnpm store），**没缓存 target**，
    #   runner 每次是空的 → build-common.sh 的 SKIP_BUILD（缺省即复用）无物可复用。
    #   key 用**官方 tag**（源码变了必须重编）+ 构建逻辑指纹（这些文件变了也重编）。
    #   仍用 tar 单文件：目录太大/文件太多会让 cache action 同样吃内存。
    - name: 复用已构建的 target（按官方 tag 命中）
      id: cache-target
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/reuse-target.tar.gz
        # v2：修正了 tar 漏 .build-done 的问题；版本前缀保证旧缓存（可能不完整）不再被命中。
        # 同时把 action 自身纳入指纹：打包/解包逻辑一变即换 key，避免命中语义已变的旧缓存。
        key: dsh-target-v2-${{ steps.tag.outputs.tag }}-${{ hashFiles('build/build-config.yaml','build/build-common.sh','build/prune-target.sh','build/prune_common.py','build/build-prune-whitelist.json','scripts/lib/common.sh','.github/actions/build-target/action.yml','.github/actions/pack-with-target/action.yml') }}
        restore-keys: |
          dsh-target-${{ steps.tag.outputs.tag }}-

